name: adversarylabs/lang/go
version: 0.0.9
description: >
  Go language pack — runs the full Go specialist suite (concurrency, security,
  http, modules, …) plus this package’s own TLS/shell/permissions checks.

# Composition: `adversary run lang/go` expands these (CLI with uses support).
# Members detect; this package contributes generic Go security smells and is the
# entry voice root when run by name.
uses:
  - name: go/cli
  - name: go/concurrency
  - name: go/database
  - name: go/http
  - name: go/modules
  - name: go/observability
  - name: go/performance
  - name: go/project
  - name: go/security
  - name: go/testing

triggers:
  manual: true
  files_changed:
    - "**/*.go"

detection:
  files:
    - "**/*.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
